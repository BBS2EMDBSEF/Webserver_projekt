<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Verzeichnis</title>
    <link rel="stylesheet" href="../../css/website/index.css">
    <link rel="stylesheet" href="../../css/user_directory/user_directory.css">
</head>
<body>
    <header>
        <h1>User-Verzeichnis Seite</h1>
        <div class="auth-buttons">
            <a href="../website/index.html" class="btn">Zurück zur Startseite</a>
        </div>
    </header>
    <main>
        <p>Willkommen im Userverzeichnis!</p>
        <div class="drag-drop-container">
            <!-- Upload Bereich -->
            <div class="drag-area" id="upload-area">
                <p>Drag & Drop Dateien hierher, um sie hochzuladen</p>
                <button onclick="triggerUpload()">Datei auswählen</button>
                <input type="file" id="file-upload" multiple style="display: none;">
            </div>

            <!-- Download Bereich -->
            <div class="drag-area" id="download-area">
                <p>Drag & Drop Dateien hierher, um sie herunterzuladen</p>
                <button onclick="triggerDownload()">Herunterladen</button>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Deine Webseite. Alle Rechte vorbehalten.</p>
    </footer>

    <script src="../../js/user_directory/user_directory.js"></script>
</body>
</html>
